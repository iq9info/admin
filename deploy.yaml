name: Deploy Web Portal to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Firebase Config Secrets
        env:
          API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          sed -e "s|ENV_FIREBASE_API_KEY|$API_KEY|g" \
              -e "s|ENV_FIREBASE_AUTH_DOMAIN|$AUTH_DOMAIN|g" \
              -e "s|ENV_FIREBASE_PROJECT_ID|$PROJECT_ID|g" \
              -e "s|ENV_FIREBASE_STORAGE_BUCKET|$STORAGE_BUCKET|g" \
              -e "s|ENV_FIREBASE_MESSAGING_SENDER_ID|$SENDER_ID|g" \
              -e "s|ENV_FIREBASE_APP_ID|$APP_ID|g" \
              js/config.template.js > js/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4